name: Gerar APK

on:
  push:
    branches: [cartube]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CarTube-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CarTube.apk

      - name: Publicar release (download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cartube-v${{ github.run_number }}
          name: CarTube v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "Baixe o CarTube.apk abaixo e instale no celular. Instruções no README da branch cartube."
          files: CarTube.apk
